<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拓石寄意 · 白花石刻寄情居</title>
  <style>:root {
  color-scheme: light;
  --paper: #f8f4eb;
  --ink: #39785c;
  --muted: #527e6c;
  --gold: #ab8539;
  --line: #a2c1b3;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: #91aaa0; isolation: isolate; min-height: 100svh; font: 16px/1.6 "Songti SC", "STSong", "SimSun", serif; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
button:disabled { cursor: default; }
main, footer { width: min(1180px, 83%); margin-inline: auto; }
main { margin-top: clamp(28px, 4vw, 64px); border-top: 1px solid var(--line); }
.intro { padding: 16px 0 30px; }
.intro h1 { margin: 0 0 10px; font-size: clamp(36px, 3.65vw, 56px); font-weight: 600; line-height: 1.2; letter-spacing: .04em; }
.intro p { margin: 0; color: #357f70; font-size: clamp(16px, 1.35vw, 20px); letter-spacing: .075em; }
.layout { display: grid; grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr); gap: clamp(36px, 6vw, 90px); align-items: start; }
.stage { position: relative; isolation: isolate; padding: 20px 15px 24px; border: 1px solid #c7d1bb; background: linear-gradient(135deg, #e6ebdd, #f8f3eb 55%, #d9e4d4); }
.stage::before { content: ""; position: absolute; inset: 12px -12px -12px 12px; border: 1px solid #dbc997; z-index: -1; pointer-events: none; }
.scene { position: relative; width: 100%; height: 470px; isolation: isolate; }
.scene::before { content: ""; position: absolute; width: 70%; height: 48px; left: 15%; bottom: 76px; border-radius: 50%; background: #54715b; opacity: .17; filter: blur(14px); }
.stone-base { position: absolute; width: min(76%, 350px); aspect-ratio: 1; left: 50%; top: 30px; transform: translateX(-50%) rotate(-3deg); padding: 10px; background: linear-gradient(145deg, #60745c, #334e3f); border: 1px solid #8b9a7d; box-shadow: 3px 5px 0 #465b47, 5px 8px 0 #809076, 9px 14px 20px #3f5a4330; border-radius: 4px; }
.stone-base > img { display: block; width: 100%; height: 100%; object-fit: cover; box-shadow: 0 0 0 1px #8f9c7b; }
.rubbing-sheet { position: absolute; inset: -6px; background: #fbf6e8; border: 1px solid #dbcfb2; box-shadow: 0 3px 9px #313c3b32; transform-origin: top left; transition: transform .7s cubic-bezier(.2,.7,.24,1), box-shadow .7s; }
#rubbing { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.rubbing-sheet::before { content: ""; position: absolute; inset: 8px; border: 1px solid #d6c8a04f; pointer-events: none; }
.peel-corner { position: absolute; right: -1px; bottom: -1px; width: 42px; height: 42px; padding: 12px 0 0 12px; background: linear-gradient(135deg, transparent 48%, #e6d9b9 49%, #fffaf0 90%); border: 0; color: #537459; font-size: 17px; }
.peel-corner:disabled { opacity: .35; }
.ready .peel-corner { filter: drop-shadow(-2px -2px 2px #5d60402b); }
.peeling .rubbing-sheet, .revealed .rubbing-sheet { transform: translate(-5px, -13px) rotate(6deg); box-shadow: 5px 18px 20px #3f5a4330; }
.revealed #rubbing { cursor: default; touch-action: auto; }
.revealed .peel-corner { visibility: hidden; }
.dabber { position: absolute; left: 4%; bottom: 68px; width: 75px; height: 114px; transform: rotate(-27deg); pointer-events: none; filter: drop-shadow(2px 4px 3px #4f654c25); }
.dabber-handle { position: absolute; left: 26px; top: 0; width: 24px; height: 63px; border-radius: 12px 12px 6px 6px; background: linear-gradient(90deg, #5b7f6b, #9fb29a 47%, #648575); border: 1px solid #66826c; }
.dabber-head { position: absolute; bottom: 0; width: 75px; height: 65px; border-radius: 48% 48% 42% 42%; background: repeating-linear-gradient(75deg, transparent 0 6px, #92855e1a 7px 8px), radial-gradient(ellipse at 45% 25%, #f2e8ce, #b9bea4 60%, #697b64 95%); border: 1px solid #c3c2a5; }
.dabber-knot { position: absolute; top: 43px; left: 20px; width: 35px; height: 14px; border-block: 2px solid #c1a671; background: #73917b; border-radius: 30%; }
.stone-seal { position: absolute; right: 4%; bottom: 77px; padding: 3px 7px; border: 2px double #c38f75; color: #ba806b; font-size: 16px; line-height: 1.3; transform: rotate(5deg); }
.piece-caption { position: absolute; left: 12%; right: 12%; bottom: 15px; text-align: center; letter-spacing: .06em; color: #55775f; }
.piece-caption span { display: block; overflow-wrap: anywhere; }
#piece-title { font-size: 18px; }
#piece-dedication { margin-top: 4px; font-size: 13px; color: #a47b4c; }
.hint { margin: 0; padding: 0 8px; color: #527861; font-size: 14px; text-align: center; letter-spacing: .03em; min-height: 44px; }
.step { color: var(--gold); font-size: 13px; letter-spacing: .14em; margin: 0 0 8px; }
.desk h2 { font-weight: 600; font-size: clamp(26px, 2.4vw, 36px); line-height: 1.4; margin: 0; letter-spacing: .025em; }
.options { display: flex; gap: 20px; margin: 16px 0 18px; }
.tile { position: relative; width: 128px; max-width: calc(50% - 10px); aspect-ratio: 1; flex-shrink: 0; padding: 10px 6px 16px; border: 0; border-radius: 40%; background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj4KPGRlZnM+CiA8bGluZWFyR3JhZGllbnQgaWQ9InBhcGVyIiB4Mj0iLjMiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjZDFlNmRjIiBzdG9wLW9wYWNpdHk9Ii44NSIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI2ZhZjZlOSIgc3RvcC1vcGFjaXR5PSIuNyIvPjwvbGluZWFyR3JhZGllbnQ+CiA8cGF0aCBpZD0iZnJhbWUiIGQ9Ik02MCAzNUM2NSAwIDEzNSAwIDE0MCAzNUMxNzAgMzMgMTk3IDYzIDE5MCAxMDBDMTk3IDEzNyAxNzAgMTY3IDE0MCAxNjVDMTM1IDIwMCA2NSAyMDAgNjAgMTY1QzMwIDE2NyAzIDEzNyAxMCAxMDBDMyA2MyAzMCAzMyA2MCAzNVoiLz4KPC9kZWZzPgo8dXNlIGhyZWY9IiNmcmFtZSIgZmlsbD0idXJsKCNwYXBlcikiIHN0cm9rZT0iI2RmY2M5NSIgc3Ryb2tlLXdpZHRoPSIxIi8+Cjx1c2UgaHJlZj0iI2ZyYW1lIiB0cmFuc2Zvcm09InRyYW5zbGF0ZSg1IDUpIHNjYWxlKC45NSkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2RmY2M5NSIgc3Ryb2tlLXdpZHRoPSIuOCIvPgo8L3N2Zz4K") center / contain no-repeat; font-size: 15px;  background-color: #f8f3eb; }
.tile img { display: block; margin: 0 auto 3px; width: 64%; height: 70%; object-fit: cover; border-radius: 25%; border: 1px solid #b5bc9e; }
.tile[aria-pressed="true"] { background-color: #c7ddc7; box-shadow: 0 0 0 1px #8daa8f; }
.tile[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 4px; top: 3px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #4c796e; color: #fffaf0; font: 14px/1 sans-serif; }
.tile:hover { background-color: #d8e6d4; }
.desk label { display: block; margin: 10px 0 5px; font-size: 15px; letter-spacing: .08em; }
.progress-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.progress-heading label { margin: 0; }
.progress-heading output { font-size: 14px; color: #a07f43; }
progress { width: 100%; display: block; height: 6px; margin: 10px 0; border: 0; border-radius: 0; background: #e5e4d4; accent-color: #6a8e73; }
progress::-webkit-progress-bar { background: #e5e4d4; }
progress::-webkit-progress-value { background: #6a8e73; }
progress::-moz-progress-bar { background: #6a8e73; }
.progress-help { margin: 0 0 14px; font-size: 13px; color: #6b826d; line-height: 1.7; }
.desk input, .desk textarea { display: block; width: 100%; border: 1px solid #c4c8af; background: #f8f3eb; border-radius: 0; padding: 9px 12px; font-size: 16px; line-height: 1.6; }
.desk input::placeholder { color: #7e8b79; opacity: 1; }
.desk textarea { resize: vertical; min-height: 76px; }
.primary, .quiet { padding: 11px 22px; min-height: 48px; border-radius: 0; border: 1px solid #4c796e; }
.primary { background: #4c796e; color: #fffaf0; }
.primary:hover { background: #355e51; }
.quiet { color: var(--ink); background: #f8f4eb; }
.action { width: 100%; margin-top: 20px; font-size: 18px; letter-spacing: .05em; }
.secondary-actions { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
.text-button { margin-top: 12px; padding: 6px; border: 0; background: transparent; text-decoration: underline; text-underline-offset: 4px; font-size: 14px; }
.receipt { width: min(820px, 94vw); max-height: 95dvh; overflow: auto; border: 1px solid var(--gold); padding: 16px; background: var(--paper); color: var(--ink); }
.receipt::backdrop { background: #173b2b95; }
.receipt canvas { width: 100%; display: block; height: auto; }
.buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0 0; }
.download-status { margin: 8px 0 0; text-align: center; font-size: 14px; }
.download-status:empty { display: none; }
footer { border-top: 1px solid var(--line); margin-top: 68px; padding: 18px 0 28px; font-size: 14px; color: #3c5c49; letter-spacing: .03em; }
.sr-only { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
[hidden] { display: none !important; }
@media (max-width: 900px) {

  main, footer { width: 88%; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 48px; }
  .scene { width: min(100%, 550px); margin: auto; }
  .desk { padding: 0 3%; }
  footer { margin-top: 38px; }
}
@media (max-width: 500px) {
  .intro { padding: 20px 0 24px; }
  .intro h1 { font-size: 38px; }
  .intro p { font-size: 16px; line-height: 1.7; }
  .stage { padding: 15px 8px 20px; }
  .stage::before { inset: 8px -8px -8px 8px; }
  .scene { height: 365px; }
  .stone-base { width: 79%; top: 26px; }
  .dabber { width: 60px; left: 0; bottom: 62px; transform: rotate(-27deg) scale(.8); transform-origin: bottom left; }
  .stone-seal { right: 1%; bottom: 72px; font-size: 13px; }
  .piece-caption { bottom: 5px; }
  #piece-title { font-size: 16px; }
  .hint { font-size: 13px; padding-top: 8px; }
  .desk { padding: 0; }
  .tile { width: 124px; }
  .receipt { padding: 8px; }
  .buttons { gap: 8px; }
  .buttons button { padding-inline: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

main, footer { position: relative; z-index: 1; }
.page-background {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  object-position: center;
  display: block;
  pointer-events: none;
  user-select: none;
}

  <script>'use strict';

const scene = document.querySelector('.scene');
const sheet = document.querySelector('.rubbing-sheet');
const stoneImage = document.querySelector('#stone-image');
const rubbing = document.querySelector('#rubbing');
const rubbingContext = rubbing.getContext('2d');
const tiles = [...document.querySelectorAll('.tile')];
const action = document.querySelector('#action');
const peelButton = document.querySelector('#peel');
const dabButton = document.querySelector('#dab');
const restart = document.querySelector('#restart');
const hint = document.querySelector('.hint');
const progressBlock = document.querySelector('.progress-block');
const progress = document.querySelector('#coverage');
const progressLabel = document.querySelector('#coverage-label');
const recipient = document.querySelector('#recipient');
const message = document.querySelector('#message');
const dedication = document.querySelector('#piece-dedication');
const dialog = document.querySelector('.receipt');
const giftCanvas = document.querySelector('#gift');
const save = document.querySelector('#save');
const downloadStatus = document.querySelector('#download-status');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

const ink = document.createElement('canvas');
ink.width = ink.height = 512;
const mask = document.createElement('canvas');
mask.width = mask.height = 640;
const maskContext = mask.getContext('2d');
const transfer = document.createElement('canvas');
transfer.width = transfer.height = 640;
const transferContext = transfer.getContext('2d');
const samplePoints = Array.from({length: 36}, (_, index) => ({
  x: 64 + (index % 6 + .5) * 512 / 6,
  y: 64 + (Math.floor(index / 6) + .5) * 512 / 6,
  covered: false
}));

let selectedTile = tiles[0];
let state = 'loading';
let loaded = false;
let percentage = 0;
let gesture = null;
let revealTimer;

function giftText() {
  return {
    name: recipient.value.trim() || '亲爱的你',
    wish: message.value.trim().replace(/\s+/g, ' ') || '愿你心有清欢，岁月留香。'
  };
}

function prepareInk() {
  const context = ink.getContext('2d', {willReadFrequently: true});
  context.drawImage(selectedTile.querySelector('img'), 0, 0, 512, 512);
  const pixels = context.getImageData(0, 0, 512, 512);
  // Translate the existing relief's light and shade into warm monochrome ink.
  for (let index = 0; index < pixels.data.length; index += 4) {
    const luminance = (pixels.data[index] * .2126 + pixels.data[index + 1] * .7152 + pixels.data[index + 2] * .0722) / 255;
    const value = Math.max(0, Math.min(1, (luminance - .28) / .5));
    pixels.data[index] = Math.round(28 + value * 210);
    pixels.data[index + 1] = Math.round(38 + value * 195);
    pixels.data[index + 2] = Math.round(32 + value * 177);
  }
  context.putImageData(pixels, 0, 0);
}

function drawRubbing() {
  const paper = rubbingContext.createLinearGradient(0, 0, 640, 640);
  paper.addColorStop(0, '#fffaf0');
  paper.addColorStop(1, '#f3ecdc');
  rubbingContext.fillStyle = paper;
  rubbingContext.fillRect(0, 0, 640, 640);
  rubbingContext.fillStyle = '#ae9a6a0a';
  for (let y = 2; y < 640; y += 4) rubbingContext.fillRect(0, y, 640, 1);
  transferContext.clearRect(0, 0, 640, 640);
  transferContext.globalCompositeOperation = 'source-over';
  transferContext.drawImage(ink, 64, 64, 512, 512);
  transferContext.globalCompositeOperation = 'destination-in';
  transferContext.drawImage(mask, 0, 0);
  transferContext.globalCompositeOperation = 'source-over';
  rubbingContext.drawImage(transfer, 0, 0);
}

function render() {
  const active = state === 'rubbing' || state === 'ready';
  scene.className = 'scene ' + state;
  sheet.hidden = state === 'stone' || state === 'loading';
  progressBlock.hidden = sheet.hidden;
  progress.value = percentage;
  progress.textContent = percentage + '%';
  progressLabel.textContent = percentage + '%';
  peelButton.disabled = state !== 'ready';
  action.disabled = !loaded || state === 'peeling';
  tiles.forEach(tile => {
    tile.disabled = !loaded || state === 'peeling';
    tile.setAttribute('aria-pressed', String(tile === selectedTile));
  });
  dabButton.hidden = state !== 'ready' || percentage === 100;
  restart.hidden = !loaded || state === 'stone';
  restart.disabled = state === 'peeling';
  rubbing.style.touchAction = active ? 'none' : 'auto';
  dedication.hidden = state !== 'revealed';
  const labels = {
    stone: '覆上拓纸',
    rubbing: '轻拓下一处',
    ready: '从纸角揭起拓片',
    peeling: '正在揭起拓片…',
    revealed: '生成拓片赠礼图'
  };
  if (labels[state]) action.textContent = labels[state];
  updateGreeting();
}

function updateGreeting() {
  dedication.textContent = '寄予 · ' + giftText().name;
}

function clearGesture() {
  const previous = gesture;
  gesture = null;
  if (previous && rubbing.hasPointerCapture(previous.pointerId)) {
    rubbing.releasePointerCapture(previous.pointerId);
  }
}

function choose(tile) {
  if (!loaded || state === 'peeling') return;
  clearTimeout(revealTimer);
  clearGesture();
  selectedTile = tile;
  state = 'stone';
  percentage = 0;
  samplePoints.forEach(point => { point.covered = false; });
  maskContext.clearRect(0, 0, 640, 640);
  prepareInk();
  drawRubbing();
  stoneImage.src = tile.querySelector('img').src;
  stoneImage.alt = tile.textContent.trim() + '石刻纹样';
  document.querySelector('#piece-title').textContent = tile.textContent.trim();
  hint.textContent = '选一方石刻纹样，先把拓纸覆在石面上。';
  render();
}

function cover() {
  if (state !== 'stone') return;
  state = 'rubbing';
  hint.textContent = '在纸上轻拍或按住拖动，让墨色一点点显出花纹。';
  render();
}

function stamp(x, y) {
  const gradient = maskContext.createRadialGradient(x, y, 0, x, y, 110);
  gradient.addColorStop(0, '#ffffff');
  gradient.addColorStop(.78, '#ffffff');
  gradient.addColorStop(1, '#ffffff00');
  maskContext.fillStyle = gradient;
  maskContext.beginPath();
  maskContext.arc(x, y, 110, 0, Math.PI * 2);
  maskContext.fill();
  samplePoints.forEach(point => {
    if (Math.hypot(point.x - x, point.y - y) <= 86) point.covered = true;
  });
}

function finishStroke() {
  percentage = Math.round(samplePoints.filter(point => point.covered).length / samplePoints.length * 100);
  const previousState = state;
  state = percentage >= 86 ? 'ready' : 'rubbing';
  drawRubbing();
  render();
  if (previousState !== 'ready' && state === 'ready') {
    hint.textContent = '纹样已显现，可以揭起纸角，也可以继续轻拓补齐。';
  } else if (percentage === 100) {
    hint.textContent = '纹样已拓完整，轻点右下纸角，揭起这张拓片。';
  }
}

function dabNext() {
  if (state !== 'rubbing' && state !== 'ready') return;
  clearGesture();
  const point = samplePoints.find(sample => !sample.covered);
  if (!point) return;
  stamp(point.x, point.y);
  finishStroke();
}

function pointerPosition(event) {
  const bounds = rubbing.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(640, (event.clientX - bounds.left) * 640 / bounds.width)),
    y: Math.max(0, Math.min(640, (event.clientY - bounds.top) * 640 / bounds.height))
  };
}

function reveal() {
  if (state !== 'ready') return;
  clearGesture();
  state = 'peeling';
  hint.textContent = '纸角轻轻揭起，一方石纹留在纸上。';
  render();
  revealTimer = setTimeout(() => {
    state = 'revealed';
    render();
    hint.textContent = '拓片已揭起。题一句心意，把这份石上花影送给对方。';
    openReceipt();
  }, reducedMotion.matches ? 0 : 700);
}

function wrapText(context, text, x, y, width, lineHeight) {
  let row = '';
  for (const character of text) {
    if (row && context.measureText(row + character).width > width) {
      context.fillText(row, x, y);
      row = '';
      y += lineHeight;
    }
    row += character;
  }
  context.fillText(row, x, y);
}

function drawReceipt() {
  const context = giftCanvas.getContext('2d');
  const gift = giftText();
  const background = context.createLinearGradient(0, 0, 1440, 980);
  background.addColorStop(0, '#fffaf0');
  background.addColorStop(1, '#e9ecdd');
  context.fillStyle = background;
  context.fillRect(0, 0, 1440, 980);
  context.lineWidth = 2;
  context.strokeStyle = '#9eae92';
  context.strokeRect(28, 28, 1384, 924);
  context.strokeStyle = '#c6a577';
  context.strokeRect(38, 38, 1364, 904);
  context.fillStyle = '#8f7845';
  context.font = '27px "STZhongsong", "华文中宋", serif';
  context.fillText('白花石刻 · 寄情居', 92, 133);
  context.fillStyle = '#39785c';
  context.font = '76px "STZhongsong", "华文中宋", serif';
  context.fillText('拓石寄意', 86, 255);
  context.fillStyle = '#a57651';
  context.font = '34px "STZhongsong", "华文中宋", serif';
  context.fillText('寄予 · ' + gift.name, 92, 370, 650);
  context.fillStyle = '#365f4c';
  context.font = '38px "STZhongsong", "华文中宋", serif';
  wrapText(context, gift.wish, 92, 470, 625, 64);

  context.fillStyle = '#c5ceb8';
  context.fillRect(827, 234, 514, 514);
  // Preserve the visitor's actual rubbing marks in the exported gift.
  context.drawImage(rubbing, 812, 219, 514, 514);
  context.strokeStyle = '#d5c5a2';
  context.lineWidth = 2;
  context.strokeRect(812, 219, 514, 514);
  context.fillStyle = '#527e6c';
  context.textAlign = 'center';
  context.font = '25px "STZhongsong", "华文中宋", serif';
  context.fillText(selectedTile.textContent.trim() + ' · 亲手拓印', 1069, 789);
  context.textAlign = 'left';
  context.strokeStyle = '#b9c4ac';
  context.lineWidth = 1;
  context.beginPath();
  context.moveTo(92, 854);
  context.lineTo(1348, 854);
  context.stroke();
  context.font = '25px "STZhongsong", "华文中宋", serif';
  context.fillText('四城五艺的材料之境', 92, 912);
  document.querySelector('#receipt-copy').textContent =
    '寄给' + gift.name + '。' + gift.wish + '。拓片纹样为' + selectedTile.textContent.trim() + '。';
}

function openReceipt() {
  drawReceipt();
  downloadStatus.textContent = '';
  if (!dialog.open) dialog.showModal();
}

tiles.forEach(tile => tile.addEventListener('click', () => choose(tile)));
restart.addEventListener('click', () => { choose(selectedTile); action.focus(); });
dabButton.addEventListener('click', dabNext);
peelButton.addEventListener('click', reveal);
recipient.addEventListener('input', updateGreeting);
action.addEventListener('click', () => {
  if (state === 'stone') cover();
  else if (state === 'rubbing') dabNext();
  else if (state === 'ready') reveal();
  else if (state === 'revealed') openReceipt();
});
document.querySelector('#back').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => action.focus());

rubbing.addEventListener('pointerdown', event => {
  if ((state !== 'rubbing' && state !== 'ready') || event.button !== 0 || gesture) return;
  const point = pointerPosition(event);
  gesture = {pointerId: event.pointerId, ...point};
  rubbing.setPointerCapture(event.pointerId);
  stamp(point.x, point.y);
  finishStroke();
});
rubbing.addEventListener('pointermove', event => {
  if (!gesture || gesture.pointerId !== event.pointerId) return;
  const point = pointerPosition(event);
  const distance = Math.hypot(point.x - gesture.x, point.y - gesture.y);
  const steps = Math.max(1, Math.ceil(distance / 24));
  for (let index = 1; index <= steps; index++) {
    stamp(gesture.x + (point.x - gesture.x) * index / steps,
      gesture.y + (point.y - gesture.y) * index / steps);
  }
  gesture.x = point.x;
  gesture.y = point.y;
  finishStroke();
});
rubbing.addEventListener('pointerup', event => {
  if (gesture && gesture.pointerId === event.pointerId) clearGesture();
});
rubbing.addEventListener('pointercancel', event => {
  if (gesture && gesture.pointerId === event.pointerId) clearGesture();
});
rubbing.addEventListener('lostpointercapture', () => { gesture = null; });

save.addEventListener('click', async () => {
  if (save.disabled) return;
  save.disabled = true;
  downloadStatus.textContent = '正在生成图片…';
  try {
    const blob = await new Promise(resolve => giftCanvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('Image encoding failed');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const name = giftText().name.replace(/[<>:"/\\|?*]/g, '').slice(0, 24) || '赠礼';
    link.href = url;
    link.download = '石刻拓片-' + name + '.png';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    downloadStatus.textContent = '图片已生成，请查看浏览器下载。';
  } catch {
    downloadStatus.textContent = '图片生成失败，请再试一次。';
  } finally {
    save.disabled = false;
  }
});

render();
Promise.all(tiles.map(tile => tile.querySelector('img').decode()))
  .then(() => { loaded = true; choose(selectedTile); })
  .catch(() => {
    loaded = false;
    state = 'loading';
    render();
    action.textContent = '石刻未能加载';
    hint.textContent = '石刻素材加载失败，请重新打开页面。';
  });
</script>
</body>
</html>
