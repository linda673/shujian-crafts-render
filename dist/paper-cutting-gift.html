<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>窗花寄晴 · 三台剪纸寄情居</title>
  <style>:root {
  color-scheme: light;
  --paper: #f8f4eb;
  --ink: #39785c;
  --muted: #527e6c;
  --gold: #ab8539;
  --line: #a2c1b3;
  --glass: #f3f1d9;
  --glow: #f3e7b6;
  --shadow-x: 10px;
  --shadow-y: 14px;
  --sun-x: 14%;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: #91aaa0; isolation: isolate; min-height: 100svh; font: 16px/1.6 "Songti SC", "STSong", "SimSun", serif; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
button:disabled { cursor: default; }
main, footer { width: min(1180px, 83%); margin-inline: auto; }
main { margin-top: clamp(28px, 4vw, 64px); border-top: 1px solid var(--line); }
.intro { padding: 16px 0 30px; }
.intro h1 { margin: 0 0 10px; font-size: clamp(36px, 3.65vw, 56px); font-weight: 600; line-height: 1.2; letter-spacing: .04em; }
.intro p { margin: 0; color: #357f70; font-size: clamp(16px, 1.35vw, 20px); letter-spacing: .075em; }
.layout { display: grid; grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr); gap: clamp(36px, 6vw, 90px); align-items: start; }
.stage { position: relative; isolation: isolate; padding: 10px 15px 24px; border: 1px solid #c7d1bb; background: linear-gradient(135deg, #e6ebdd, #f8f3eb 55%, #d9e4d4); }
.stage::before { content: ""; position: absolute; inset: 12px -12px -12px 12px; border: 1px solid #dbc997; z-index: -1; pointer-events: none; }
.scene { position: relative; width: 100%; height: 485px; isolation: isolate; overflow: hidden; }
.sun { position: absolute; left: var(--sun-x); top: 17px; width: 94px; height: 94px; border-radius: 50%; background: var(--glow); opacity: .65; transition: left .15s, background-color .15s; }
.window { position: absolute; width: 76%; max-width: 370px; left: 50%; top: 32px; transform: translateX(-50%); }
.window-cap { height: 17px; margin: 0 -5%; background: linear-gradient(#95b29b, #567f68 53%, #d7c594 56%, #d7c594 67%, #779780 70%); border: 1px solid #748f71; }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; height: 300px; padding: 9px; background: #74947c; border: 3px solid #91a98a; box-shadow: inset 0 0 0 1px #d7c99d, 4px 7px 15px #46664718; }
.pane { position: relative; min-width: 0; padding: 0; border: 2px solid #b0ba98; background: linear-gradient(135deg, #ffffff65, transparent 85%), var(--glass); box-shadow: inset 0 0 0 3px #f5edcd, inset 0 0 18px #a4a48225; overflow: hidden; transition: background-color .15s; }
.pane::before { content: ""; position: absolute; inset: 7px; border: 1px solid #b7b78a65; pointer-events: none; }
.pane::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #a99d7620 0 1px, transparent 1px 3px); opacity: .3; pointer-events: none; }
.cutout, .shadow { position: absolute; width: 80%; height: 80%; left: 10%; top: 10%; object-fit: contain; pointer-events: none; }
.cutout { filter: drop-shadow(0 1px 0 #f7d7b3); z-index: 1; }
.shadow { filter: brightness(0) blur(1px); opacity: .14; transform: translate(var(--shadow-x), var(--shadow-y)) skewX(-8deg); transition: transform .15s; }
.place-mark { position: absolute; inset: 0; display: grid; place-items: center; font-size: 25px; color: #72967b; opacity: 0; }
.ready .pane:not([aria-pressed="true"]) .place-mark { opacity: .6; }
.ready .pane:not([aria-pressed="true"]):hover { box-shadow: inset 0 0 0 3px #c3d1af; }
.window-sill { margin: 0 -6%; height: 16px; border-bottom: 4px solid #a6b094; background: linear-gradient(#ece7cb, #d4d5b8); box-shadow: 0 5px 8px #62714a16; }
.fold-control { position: absolute; width: 155px; height: 150px; bottom: 5px; left: calc(50% - 77.5px); padding: 0; border: 0; background: transparent; }
.paper-underlay { position: absolute; width: 124px; height: 124px; left: 15px; top: 0; border: 1px solid #ddc99d; background: linear-gradient(145deg, #fff8e5, #f0e2c5); transform: rotate(-8deg); box-shadow: 2px 4px 9px #6a71542b; }
.fold-art { position: absolute; width: 122px; height: 122px; top: 1px; left: 16px; perspective: 650px; }
.quarter { position: absolute; width: 50%; height: 50%; overflow: hidden; background: #fbe9d2; transition: transform .6s cubic-bezier(.2,.7,.24,1); backface-visibility: visible; border: 1px solid #e0c9a050; }
.quarter img { position: absolute; width: 200%; height: 200%; object-fit: contain; max-width: none; }
.q1 { left: 0; top: 0; transform-origin: right bottom; transform: rotateY(180deg) rotateX(180deg); z-index: 4; }
.q2 { right: 0; top: 0; transform-origin: center bottom; transform: rotateX(180deg); z-index: 3; }
.q3 { left: 0; bottom: 0; transform-origin: right center; transform: rotateY(180deg); z-index: 2; }
.q4 { right: 0; bottom: 0; }
.q1 img { left: 0; top: 0; }
.q2 img { right: 0; top: 0; }
.q3 img { left: 0; bottom: 0; }
.q4 img { right: 0; bottom: 0; }
.half-open .q1 { transform: rotateY(180deg); }
.half-open .q2 { transform: none; }
.unfolded .quarter { transform: none; }
.fold-label { position: absolute; bottom: -3px; left: -15px; right: -15px; font-size: 13px; color: #6f795d; }
.window-dedication { position: absolute; left: 7%; right: 7%; bottom: 24px; margin: 0; text-align: center; font-size: 16px; line-height: 1.8; color: #527861; }
.window-dedication span { display: block; overflow-wrap: anywhere; }
.window-dedication span:first-child { color: #ac8152; margin-bottom: 5px; font-size: 14px; }
.hint { margin: 0; padding: 0 8px; color: #527861; font-size: 14px; text-align: center; letter-spacing: .03em; min-height: 44px; }
.step { color: var(--gold); font-size: 13px; letter-spacing: .14em; margin: 0 0 8px; }
.desk h2 { font-weight: 600; font-size: clamp(26px, 2.4vw, 36px); line-height: 1.4; margin: 0; letter-spacing: .025em; }
.options { display: flex; gap: 20px; margin: 16px 0 18px; }
.tile { position: relative; width: 128px; max-width: calc(50% - 10px); aspect-ratio: 1; flex-shrink: 0; padding: 10px 6px 16px; border: 0; border-radius: 40%; background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj4KPGRlZnM+CiA8bGluZWFyR3JhZGllbnQgaWQ9InBhcGVyIiB4Mj0iLjMiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjZDFlNmRjIiBzdG9wLW9wYWNpdHk9Ii44NSIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI2ZhZjZlOSIgc3RvcC1vcGFjaXR5PSIuNyIvPjwvbGluZWFyR3JhZGllbnQ+CiA8cGF0aCBpZD0iZnJhbWUiIGQ9Ik02MCAzNUM2NSAwIDEzNSAwIDE0MCAzNUMxNzAgMzMgMTk3IDYzIDE5MCAxMDBDMTk3IDEzNyAxNzAgMTY3IDE0MCAxNjVDMTM1IDIwMCA2NSAyMDAgNjAgMTY1QzMwIDE2NyAzIDEzNyAxMCAxMDBDMyA2MyAzMCAzMyA2MCAzNVoiLz4KPC9kZWZzPgo8dXNlIGhyZWY9IiNmcmFtZSIgZmlsbD0idXJsKCNwYXBlcikiIHN0cm9rZT0iI2RmY2M5NSIgc3Ryb2tlLXdpZHRoPSIxIi8+Cjx1c2UgaHJlZj0iI2ZyYW1lIiB0cmFuc2Zvcm09InRyYW5zbGF0ZSg1IDUpIHNjYWxlKC45NSkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2RmY2M5NSIgc3Ryb2tlLXdpZHRoPSIuOCIvPgo8L3N2Zz4K") center / contain no-repeat; background-color: #f8f3eb; font-size: 15px; }
.tile img { display: block; margin: 0 auto 3px; width: 68%; height: 72%; object-fit: contain; }
.tile[aria-pressed="true"] { background-color: #c7ddc7; box-shadow: 0 0 0 1px #8daa8f; }
.tile[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 4px; top: 3px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #4c796e; color: #fffaf0; font: 14px/1 sans-serif; }
.tile:hover { background-color: #d8e6d4; }
.desk label { display: block; margin: 10px 0 5px; font-size: 15px; letter-spacing: .08em; }
.light-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.light-heading label { margin: 0; }
.light-heading output { color: #a07f43; font-size: 14px; }
#light { display: block; width: 100%; margin: 10px 0 0; height: 26px; accent-color: #6a8e73; cursor: pointer; }
.light-labels { display: flex; justify-content: space-between; font-size: 12px; color: #73856e; margin-bottom: 12px; }
.desk input[type="text"], .desk input:not([type]), .desk textarea { display: block; width: 100%; border: 1px solid #c4c8af; background: #f8f3eb; border-radius: 0; padding: 9px 12px; font-size: 16px; line-height: 1.6; }
.desk input::placeholder { color: #7e8b79; opacity: 1; }
.desk textarea { resize: vertical; min-height: 76px; }
.primary, .quiet { padding: 11px 22px; min-height: 48px; border-radius: 0; border: 1px solid #4c796e; }
.primary { background: #4c796e; color: #fffaf0; }
.primary:hover { background: #355e51; }
.quiet { color: var(--ink); background: #f8f4eb; }
.action { width: 100%; margin-top: 20px; font-size: 18px; letter-spacing: .05em; }
.text-button { display: block; margin: 16px auto 0; padding: 6px 12px; border: 0; background: transparent; text-decoration: underline; text-underline-offset: 4px; }
.receipt { width: min(820px, 94vw); max-height: 95dvh; overflow: auto; border: 1px solid var(--gold); padding: 16px; background: var(--paper); color: var(--ink); }
.receipt::backdrop { background: #173b2b95; }
.receipt canvas { width: 100%; display: block; height: auto; }
.buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0 0; }
.download-status { margin: 8px 0 0; text-align: center; font-size: 14px; }
.download-status:empty { display: none; }
footer { border-top: 1px solid var(--line); margin-top: 68px; padding: 18px 0 28px; font-size: 14px; color: #3c5c49; letter-spacing: .03em; }
.sr-only { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
[hidden] { display: none !important; }
@media (max-width: 900px) {

  main, footer { width: 88%; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 48px; }
  .scene { width: min(100%, 550px); margin: auto; }
  .desk { padding: 0 3%; }
  footer { margin-top: 38px; }
}
@media (max-width: 500px) {
  .intro { padding: 20px 0 24px; }
  .intro h1 { font-size: 38px; }
  .intro p { font-size: 16px; line-height: 1.7; }
  .stage { padding: 4px 8px 20px; }
  .stage::before { inset: 8px -8px -8px 8px; }
  .scene { height: 462px; }
  .window { width: 85%; top: 24px; }
  .panes { height: 274px; padding: 6px; gap: 6px; }
  .sun { width: 75px; height: 75px; }
  .hint { font-size: 13px; }
  .window-dedication { left: 4%; right: 4%; bottom: 16px; font-size: 14px; }
  .desk { padding: 0; }
  .tile { width: 124px; }
  .receipt { padding: 8px; }
  .buttons { gap: 8px; }
  .buttons button { padding-inline: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
main, footer { position: relative; z-index: 1; }
.page-background {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  object-position: center;
  display: block;
  pointer-events: none;
  user-select: none;
}

  <main>
    <div class="intro">
      <h1>窗花寄晴</h1>
      <p>展开一纸心意，把好光景贴进窗里。</p>
    </div>
    <div class="layout">
      <section class="stage" aria-label="窗花互动场景">
        <div class="scene">
          <span class="sun" aria-hidden="true"></span>
          <div class="window">
            <div class="window-cap" aria-hidden="true"></div>
            <div class="panes" role="group" aria-label="选择贴窗花的位置">
              <button class="pane" data-position="0" aria-label="左上窗格" aria-pressed="false" disabled><img class="shadow" alt="" hidden><img class="cutout" alt="" hidden><span class="place-mark" aria-hidden="true">＋</span></button>
              <button class="pane" data-position="1" aria-label="右上窗格" aria-pressed="false" disabled><img class="shadow" alt="" hidden><img class="cutout" alt="" hidden><span class="place-mark" aria-hidden="true">＋</span></button>
              <button class="pane" data-position="2" aria-label="左下窗格" aria-pressed="false" disabled><img class="shadow" alt="" hidden><img class="cutout" alt="" hidden><span class="place-mark" aria-hidden="true">＋</span></button>
              <button class="pane" data-position="3" aria-label="右下窗格" aria-pressed="false" disabled><img class="shadow" alt="" hidden><img class="cutout" alt="" hidden><span class="place-mark" aria-hidden="true">＋</span></button>
            </div>
            <div class="window-sill" aria-hidden="true"></div>
          </div>
          <button class="fold-control" disabled aria-label="展开第一折">
            <span class="paper-underlay" aria-hidden="true"></span>
            <span class="fold-art" aria-hidden="true">
              <span class="quarter q1"><img alt=""></span>
              <span class="quarter q2"><img alt=""></span>
              <span class="quarter q3"><img alt=""></span>
              <span class="quarter q4"><img alt=""></span>
            </span>
            <span class="fold-label">轻点，展开折纸</span>
          </button>
          <p class="window-dedication" hidden><span id="scene-to"></span><span id="scene-wish"></span></p>
        </div>
        <p class="hint" role="status">选好窗花，轻点折纸，慢慢展开。</p>
      </section>

const dialog = document.querySelector('.receipt');
const canvas = document.querySelector('canvas');
const save = document.querySelector('#save');
const downloadStatus = document.querySelector('#download-status');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

let selectedTile = tiles[0];
let folds = 0;
let position = null;
let busy = false;
let ready = false;
let animationTimer;

function giftText() {
  return {
    name: recipient.value.trim() || '亲爱的你',
    wish: message.value.trim().replace(/\s+/g, ' ') || '愿你窗前有暖阳，心中有欢喜。'
  };
}

function lightSettings() {
  const amount = Math.max(0, Math.min(1, Number(light.value) / 100));
  const mix = (start, end) => Math.round(start + (end - start) * amount);
  return {
    name: amount < .34 ? '晨光' : amount < .67 ? '午后' : '夕照',
    glass: 'rgb(' + mix(243, 246) + ',' + mix(241, 214) + ',' + mix(217, 177) + ')',
    glow: 'rgb(' + mix(243, 242) + ',' + mix(231, 185) + ',' + mix(182, 143) + ')',
    x: 10 - 33 * amount,
    y: 14 + 13 * amount,
    sunX: 14 + 52 * amount
  };
}

function updateLight() {
  const settings = lightSettings();
  const style = scene.style;
  style.setProperty('--glass', settings.glass);
  style.setProperty('--glow', settings.glow);
  style.setProperty('--shadow-x', settings.x + 'px');
  style.setProperty('--shadow-y', settings.y + 'px');
  style.setProperty('--sun-x', settings.sunX + '%');
  lightName.textContent = settings.name;
  light.setAttribute('aria-valuetext', settings.name);
}

function updateGreeting() {
  const gift = giftText();
  document.querySelector('#scene-to').textContent = '寄予 · ' + gift.name;
  document.querySelector('#scene-wish').textContent = gift.wish;
}

function render() {
  foldArt.classList.toggle('half-open', folds >= 1);
  foldArt.classList.toggle('unfolded', folds === 2);
  scene.classList.toggle('ready', folds === 2 && !busy);
  foldControl.hidden = position !== null;
  foldControl.disabled = !ready || busy || folds === 2;
  dedication.hidden = position === null;
  tiles.forEach(tile => {
    tile.disabled = busy;
    tile.setAttribute('aria-pressed', String(tile === selectedTile));
  });
  panes.forEach((pane, index) => {
    pane.disabled = !ready || busy || folds < 2;
    pane.setAttribute('aria-pressed', String(position === index));
    pane.querySelectorAll('img').forEach(image => { image.hidden = position !== index; });
  });
  action.disabled = !ready || busy;
  restart.hidden = folds === 0;
  restart.disabled = busy;
  foldLabel.textContent = folds === 0 ? '轻点，展开第一折' : folds === 1 ? '再点，展开第二折' : '展开了，选个窗格吧';
  foldControl.setAttribute('aria-label', foldLabel.textContent);
  if (!ready) return;
  if (busy) {
    action.textContent = '正在展开…';
  } else if (folds < 2) {
    action.textContent = folds === 0 ? '展开第一折' : '展开第二折';
  } else {
    action.textContent = position === null ? '贴在左上窗格' : '生成窗花明信片';
  }
  updateGreeting();
}

function choose(tile) {
  if (busy) return;
  clearTimeout(animationTimer);
  selectedTile = tile;
  folds = 0;
  position = null;
  const src = tile.querySelector('img').src;
  document.querySelectorAll('.quarter img, .pane img').forEach(image => { image.src = src; });
  hint.textContent = '选好窗花，轻点折纸，慢慢展开。';
  render();
}

function unfold() {
  if (!ready || busy || folds >= 2) return;
  folds += 1;
  busy = true;
  hint.textContent = folds === 1 ? '先展开一折，图案慢慢露出来。' : '再展开一折，看见完整的窗花。';
  render();
  animationTimer = setTimeout(() => {
    busy = false;
    render();
    if (folds === 2) {
      hint.textContent = '四个窗格都可以点。挑一处，把窗花贴上去。';
      panes[0].focus();
    }
  }, reducedMotion.matches ? 0 : 620);
}

function place(index) {
  if (!ready || busy || folds !== 2) return;
  position = index;
  hint.textContent = '拖动滑钮看光影变化，也可以换个窗格。';
  render();
}

function fitImage(context, image, x, y, width, height) {
  const scale = Math.min(width / image.naturalWidth, height / image.naturalHeight);
  const imageWidth = image.naturalWidth * scale;
  const imageHeight = image.naturalHeight * scale;
  context.drawImage(image, x + (width - imageWidth) / 2, y + (height - imageHeight) / 2, imageWidth, imageHeight);
}

function wrapText(context, text, x, y, width, lineHeight) {
  let row = '';
  for (const character of text) {
    if (row && context.measureText(row + character).width > width) {
      context.fillText(row, x, y);
      row = '';
      y += lineHeight;
    }
    row += character;
  }
  context.fillText(row, x, y);
}

function drawReceipt() {
  const context = canvas.getContext('2d');
  const gift = giftText();
  const settings = lightSettings();
  const image = selectedTile.querySelector('img');
  const gradient = context.createLinearGradient(0, 0, 1440, 980);
  gradient.addColorStop(0, '#fffaf0');
  gradient.addColorStop(1, '#e9ecdd');
  context.fillStyle = gradient;
  context.fillRect(0, 0, 1440, 980);
  context.strokeStyle = '#9eae92';
  context.lineWidth = 2;
  context.strokeRect(28, 28, 1384, 924);
  context.strokeStyle = '#c6a577';
  context.strokeRect(38, 38, 1364, 904);
  context.fillStyle = '#8f7845';
  context.font = '27px "STZhongsong", "华文中宋", serif';
  context.fillText('三台剪纸 · 寄情居', 92, 133);
  context.fillStyle = '#39785c';
  context.font = '76px "STZhongsong", "华文中宋", serif';
  context.fillText('窗花寄晴', 86, 255);
  context.fillStyle = '#a57651';
  context.font = '34px "STZhongsong", "华文中宋", serif';
  context.fillText('寄予 · ' + gift.name, 92, 370, 650);
  context.fillStyle = '#365f4c';
  context.font = '38px "STZhongsong", "华文中宋", serif';
  wrapText(context, gift.wish, 92, 470, 625, 64);

  context.fillStyle = settings.glow;
  context.globalAlpha = .6;
  context.beginPath();
  context.arc(870 + Number(light.value) * 3.5, 210, 62, 0, Math.PI * 2);
  context.fill();
  context.globalAlpha = 1;
  context.fillStyle = '#76947c';
  context.fillRect(806, 240, 532, 466);
  context.fillStyle = '#bdc6a3';
  context.fillRect(792, 219, 560, 16);
  context.fillStyle = '#5c7c65';
  context.fillRect(792, 235, 560, 8);

  for (let index = 0; index < 4; index++) {
    const x = 823 + (index % 2) * 256;
    const y = 256 + Math.floor(index / 2) * 224;
    context.fillStyle = settings.glass;
    context.fillRect(x, y, 242, 210);
    context.strokeStyle = '#d6d7b8';
    context.lineWidth = 3;
    context.strokeRect(x + 5, y + 5, 232, 200);
    if (index === position) {
      context.save();
      context.beginPath();
      context.rect(x, y, 242, 210);
      context.clip();
      context.globalAlpha = .14;
      context.filter = 'brightness(0) blur(1.5px)';
      fitImage(context, image, x + 24 + settings.x * 1.4, y + 20 + settings.y * 1.4, 194, 170);
      context.restore();
      fitImage(context, image, x + 24, y + 20, 194, 170);
    }
  }
  context.fillStyle = '#d2d4b9';
  context.fillRect(787, 706, 570, 12);
  context.fillStyle = '#a5b197';
  context.fillRect(787, 718, 570, 7);
  context.fillStyle = '#527e6c';
  context.textAlign = 'center';
  context.font = '25px "STZhongsong", "华文中宋", serif';
  context.fillText(selectedTile.textContent.trim() + ' · ' + settings.name, 1072, 780);
  context.textAlign = 'left';
  context.strokeStyle = '#b9c4ac';
  context.lineWidth = 1;
  context.beginPath();
  context.moveTo(92, 854);
  context.lineTo(1348, 854);
  context.stroke();
  context.font = '25px "STZhongsong", "华文中宋", serif';
  context.fillText('四城五艺的材料之境', 92, 912);
  document.querySelector('#receipt-copy').textContent =
    '寄给' + gift.name + '。' + gift.wish + '。' + settings.name + '里，' +
    selectedTile.textContent.trim() + '贴在' + panes[position].getAttribute('aria-label') + '。';
}

tiles.forEach(tile => tile.addEventListener('click', () => choose(tile)));
panes.forEach((pane, index) => pane.addEventListener('click', () => place(index)));
foldControl.addEventListener('click', unfold);
restart.addEventListener('click', () => {
  choose(selectedTile);
  foldControl.focus();
});
light.addEventListener('input', updateLight);
recipient.addEventListener('input', updateGreeting);
message.addEventListener('input', updateGreeting);
action.addEventListener('click', () => {
  if (!ready || busy) return;
  if (folds < 2) unfold();
  else if (position === null) place(0);
  else {
    drawReceipt();
    downloadStatus.textContent = '';
    if (!dialog.open) dialog.showModal();
  }
});
document.querySelector('#back').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => action.focus());
save.addEventListener('click', async () => {
  if (save.disabled) return;
  save.disabled = true;
  downloadStatus.textContent = '正在生成图片…';
  try {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('Image encoding failed');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const name = giftText().name.replace(/[<>:"/\\|?*]/g, '').slice(0, 24) || '赠礼';
    link.href = url;
    link.download = '窗花明信片-' + name + '.png';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    downloadStatus.textContent = '图片已生成，请查看浏览器下载。';
  } catch {
    downloadStatus.textContent = '图片生成失败，请再试一次。';
  } finally {
    save.disabled = false;
  }
});

choose(selectedTile);
updateLight();
Promise.all(tiles.map(tile => tile.querySelector('img').decode()))
  .then(() => { ready = true; render(); })
  .catch(() => { hint.textContent = '窗花加载失败，请重新打开页面。'; action.textContent = '窗花未能加载'; });
</script>
</body>
</html>
